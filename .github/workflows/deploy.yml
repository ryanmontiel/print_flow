name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx -y vercel@latest --prod --yes --project tcc-printflow

      - name: Point production alias to the new deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_ID=$(curl -s "https://api.vercel.com/v6/deployments?projectId=prj_TxHwf59d5j6ebPKJCihqltQtHYsG&limit=1&target=production" -H "Authorization: Bearer $VERCEL_TOKEN" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s);const d=j.deployments.find(x=>x.readyState==='READY');if(d)console.log(d.uid);else process.exit(1)})")
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d "{\"alias\":\"tcc-printflow.vercel.app\"}" "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID/aliases"